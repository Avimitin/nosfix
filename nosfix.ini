; nosfix runtime configuration, stored beside nosfix.dll
enabled=true
; Correct cue-clock QPC precision. This alone does not replace frame judgments.
precise_audio_clock=true
; Skip startup FPS calibration; retain 60 units/s for remaining legacy logic.
skip_monitor_check=true
; Experimental host QPC input observation. No effect on judgments yet.
capture_input=false
; Experimental direct song-time projection of normal notes only.
clock_motion=false
; Diagnostic shadow song clock published to captured input. No effect on judgments.
; Requires capture_input=true and precise_audio_clock=true.
native_shadow=false
; Read-only PROBE lines for the four remaining live samples. Diagnostic only.
diagnostic_probe=false
; Live normal-note shadow comparison; never changes scoring or rendering.
native_shadow_feed=false
; Experimental native ASIO route. Fill one exact driver identity, then enable.
asio_output=false
asio_driver_clsid=
asio_driver_name=
asio_output_channels=0,1
asio_sample_rate=44100
asio_buffer_frames=128
target_hz=auto
; Predict note heads and long-note ribbons between 60 Hz ticks.
; Set false to compare against the same render rate with original geometry.
smooth_motion=true
; Predict supported AFP UI translations between 60 Hz ticks.
smooth_ui=true
log_level=info
